services:
  mytb:
    restart: always
    image: "thingsboard/tb-postgres:latest"
    ports:
      - "3000:9090" # พอร์ตสำหรับเข้าหน้าเว็บ ThingsBoard
      # ปิดพอร์ต 1883 ของ ThingsBoard ไม่ให้ชนกัน แล้วให้ Node-RED คุยผ่านเครือข่ายภายในแทน
    environment:
      TB_QUEUE_TYPE: in-memory
    volumes:
      - tb-data:/data
      - tb-logs:/var/log/thingsboard

  mosquitto:
    image: eclipse-mosquitto
    restart: always
    ports:
      - "1883:1883" # ให้ DAM ส่งข้อมูลเข้าพอร์ตนี้
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data/

  nodered:
    image: nodered/node-red
    restart: always
    ports:
      - "1880:1880" # พอร์ตสำหรับเข้าหน้าเว็บ Node-RED
    volumes:
      - ./nodered-data:/data

volumes:
  tb-data:
  tb-logs: